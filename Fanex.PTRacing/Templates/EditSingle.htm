<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{Title}</title>
    <link href='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.Core.css")}'
        rel="stylesheet" type="text/css" />
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.Languages.en.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.Core.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.BettingCommSetting.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.BetTypeGroup.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.BetType.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTRacing.UI.knockout-2.0.0.js")}'
        type="text/javascript"></script>
    <script src='{dataSource}?targetCustId={targetCustId}&targetRoleId={targetRoleId}'
        type="text/javascript"></script>
    <!--CssBlock-->
    <!--/CssBlock-->
</head>
<body>
    <div class="minWidthCustomer">
        {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        <div class="pt7">
            <div class="btnLeft">
                <button data-bind='click: saveCustomer' accountpermisssion="[B]" class="btnMain"
                    id='btnSubmit'>
                    {static:Resources.Lang.submit}
                </button>
            </div>
        </div>
        <!--ProductStatusWarning-->
        <div class="statusWarningMsg Enrich container">
            <div class="EnrichWarmsg">{static:Resources.Lang.ProductStatusWarningMessage}</div>
        </div>
        <!--/ProductStatusWarning-->
        <div class="customerInfo">
            {static:new Fanex.PTRacing.Templates.InformationSection_Template()}
        </div>
        <div class="clearBlock">
        </div>
        <div id="bettingLimitContainer">
        </div>
        <div class="clearBlock">
        </div>
        <div class="headerPositionTaking">
            {static:Resources.Lang.positiontaking}
        </div>
        <div class="positionTaking">
            <div id="ptGridContainer">
            </div>
        </div>
        <div class="clearBlock">
        </div>
        <div class="btnLeft">
            <button data-bind='click: saveCustomer' accountpermisssion="[B]" class="btnMain"
                id='btnMain'>
                {static:Resources.Lang.submit}
            </button>
        </div>
    </div>
    <!--ScriptBlock-->
    <!--/ScriptBlock-->
</body>
</html>
